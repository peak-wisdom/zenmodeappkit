<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map Art checks</title><style>body{font:16px/1.6 system-ui;max-width:900px;margin:40px auto;padding:0 20px;background:#0b191c;color:#e8f6ed}a,.pass{color:#b4eed5}.fail{color:#ffb0a0}li{margin:10px 0}</style></head><body><h1>Map Art checks</h1><p>Offline projection, tile-budget, restored-state, geometry, and export checks. Geometry used here is a synthetic unit-test fixture; it is not the map shown in the editor.</p><p><a href="./">Open Map Art Studio</a></p><p id="summary" role="status">Checking…</p><ol id="checks"></ol><script type="module">import{runChecks}from './checks.js';const results=runChecks();for(const r of results){const li=document.createElement('li');li.className=r.pass?'pass':'fail';li.textContent=(r.pass?'PASS · ':'FAIL · ')+r.name+(r.error?' — '+r.error:'');document.getElementById('checks').append(li);}document.getElementById('summary').textContent=results.filter(r=>r.pass).length+' / '+results.length+' checks passed.';</script></body></html>
