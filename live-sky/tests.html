<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Sky calculation checks</title><style>body{font:15px/1.6 system-ui;max-width:1000px;margin:40px auto;padding:0 20px;background:#0b191c;color:#e8f6ed}a{color:#b4eed5}.pass{color:#b4eed5}.fail{color:#ffb0a0}li{margin:8px 0}</style></head><body><h1>Live Sky calculation checks</h1><p>Independent NASA/JPL fixtures, UTC validation, local horizon/parallax, date limits, saved-state validation, and export checks. These run locally without network requests.</p><p><a href="./">Open Live Sky</a></p><p id="summary" role="status">Checking…</p><ol id="checks"></ol><script type="module">import{runChecks}from './checks.js';const results=runChecks();for(const result of results){const li=document.createElement('li');li.className=result.pass?'pass':'fail';li.textContent=(result.pass?'PASS · ':'FAIL · ')+result.name+(result.error?' — '+result.error:'');document.getElementById('checks').append(li);}document.getElementById('summary').textContent=results.filter(r=>r.pass).length+' / '+results.length+' checks passed.';</script></body></html>
