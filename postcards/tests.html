<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Postcard Studio checks</title><style>body{max-width:900px;margin:50px auto;padding:0 24px;font:16px/1.6 system-ui;color:#e5f6ed;background:#10251e}a{color:#b4eed5}li{margin:14px 0}.fail{color:#ffbca5}.pass{color:#b4eed5}</style></head><body><a href="./">Back to Postcard Studio</a><h1>Postcard Studio regression checks</h1><p id="summary" role="status">Running…</p><ol id="results"></ol><script type="module">import {runChecks} from './checks.js';try{const results=await runChecks();for(const result of results){const li=document.createElement('li');li.className=result.ok?'pass':'fail';li.textContent=(result.ok?'PASS: ':'FAIL: ')+result.name+(result.error?' — '+result.error:'');document.getElementById('results').append(li);}const passed=results.filter(r=>r.ok).length;document.getElementById('summary').textContent=passed+' / '+results.length+' passed';}catch(error){document.getElementById('summary').textContent='Checks could not run: '+error.message;}</script></body></html>
